<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#3c4a42",
                        "on-surface-variant": "#bbcabf",
                        "error-container": "#93000a",
                        "surface": "#0b1512",
                        "on-tertiary": "#472a00",
                        "outline": "#86948a",
                        "secondary-container": "#00bd85",
                        "on-secondary-container": "#00452e",
                        "surface-container-low": "#131e1a",
                        "surface-dim": "#0b1512",
                        "surface-container": "#17221e",
                        "surface-container-highest": "#2c3733",
                        "error": "#ffb4ab",
                        "background": "#0b1512",
                        "on-background": "#d9e5df",
                        "surface-container-high": "#222c29",
                        "surface-tint": "#4edea3",
                        "tertiary-fixed-dim": "#ffb95f",
                        "tertiary": "#ffb95f",
                        "on-secondary": "#003825",
                        "on-secondary-fixed-variant": "#005137",
                        "on-secondary-fixed": "#002114",
                        "surface-variant": "#2c3733",
                        "on-tertiary-container": "#523200",
                        "tertiary-container": "#e29100",
                        "inverse-on-surface": "#28332f",
                        "on-primary-container": "#00422b",
                        "secondary-fixed-dim": "#45dfa4",
                        "on-primary-fixed": "#002113",
                        "primary-fixed-dim": "#4edea3",
                        "on-primary-fixed-variant": "#005236",
                        "secondary-fixed": "#68fcbf",
                        "primary": "#4edea3",
                        "surface-container-lowest": "#06100d",
                        "primary-fixed": "#6ffbbe",
                        "secondary": "#45dfa4",
                        "on-error-container": "#ffdad6",
                        "primary-container": "#10b981",
                        "on-error": "#690005",
                        "inverse-primary": "#006c49",
                        "on-tertiary-fixed-variant": "#653e00",
                        "on-tertiary-fixed": "#2a1700",
                        "inverse-surface": "#d9e5df",
                        "on-primary": "#003824",
                        "surface-bright": "#313b38",
                        "tertiary-fixed": "#ffddb8",
                        "on-surface": "#d9e5df"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"],
                        "mono": ["JetBrains Mono"]
                    }
                },
            },
        }
    </script>
<style>
        .glass-panel {
            background: rgba(44, 55, 51, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(16, 185, 129, 0.08);
        }
        .bg-living-hardware {
            background-color: #040d0a;
            position: relative;
            overflow: hidden;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.15;
            z-index: 0;
        }
        .diagonal-lines {
            background-image: repeating-linear-gradient(45deg, rgba(16, 185, 129, 0.03) 0, rgba(16, 185, 129, 0.03) 1px, transparent 0, transparent 50%);
            background-size: 10px 10px;
        }
        .text-gradient {
            background: linear-gradient(to right, #10b981, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-living-hardware font-body text-on-surface min-h-screen selection:bg-primary/30">
<!-- Background Elements -->
<div class="fixed inset-0 diagonal-lines pointer-events-none"></div>
<div class="blob w-64 h-64 bg-primary -top-20 -left-20 animate-pulse"></div>
<div class="blob w-80 h-80 bg-secondary bottom-40 -right-20"></div>
<div class="blob w-48 h-48 bg-primary-container top-1/2 left-1/4 opacity-10"></div>
<div class="blob w-72 h-72 bg-tertiary bottom-0 left-0 opacity-5"></div>
<!-- Status Bar Spacer (iOS Style 44pt) -->
<div class="h-11 w-full"></div>
<!-- TopAppBar -->
<nav class="fixed top-0 w-full z-50 bg-[#040d0a]/40 backdrop-blur-xl border-b border-emerald-500/10 shadow-[0_0_40px_rgba(16,185,129,0.08)] max-w-md mx-auto left-0 right-0">
<div class="flex items-center justify-between px-6 h-16">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-emerald-500/10 transition-colors active:scale-95 duration-300 ease-out">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-['Inter'] font-extrabold tracking-tight uppercase text-gradient text-xl">Team Management</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-emerald-500/10 transition-colors active:scale-95 duration-300 ease-out">
<span class="material-symbols-outlined text-primary">person_add</span>
</button>
</div>
</nav>
<!-- Content Canvas -->
<main class="relative z-10 px-6 pt-20 pb-32 max-w-md mx-auto">
<!-- Sub-header -->
<div class="mb-6">
<p class="font-mono text-[10px] tracking-[0.2em] text-primary opacity-80 uppercase">Manage Your Organization</p>
</div>
<!-- Stats Section (2x2 Bento) -->
<div class="grid grid-cols-2 gap-4 mb-8">
<div class="glass-panel rounded-lg p-4 flex flex-col gap-1">
<span class="font-mono text-[10px] text-on-surface-variant uppercase">Total</span>
<span class="font-mono text-3xl font-bold text-primary leading-none" data-slot="teamCountTotal">0</span>
</div>
<div class="glass-panel rounded-lg p-4 flex flex-col gap-1">
<span class="font-mono text-[10px] text-on-surface-variant uppercase">Admins</span>
<span class="font-mono text-3xl font-bold text-primary leading-none" data-slot="teamCountAdmins">0</span>
</div>
<div class="glass-panel rounded-lg p-4 flex flex-col gap-1">
<span class="font-mono text-[10px] text-on-surface-variant uppercase">Invites</span>
<span class="font-mono text-3xl font-bold text-primary leading-none" data-slot="teamCountInvites">0</span>
</div>
<div class="glass-panel rounded-lg p-4 flex flex-col gap-1">
<span class="font-mono text-[10px] text-on-surface-variant uppercase">Active</span>
<span class="font-mono text-3xl font-bold text-primary leading-none" data-slot="teamCountActive">0</span>
</div>
</div>
<!-- Filter Section -->
<div class="flex gap-3 mb-8">
<div class="flex-1 glass-panel rounded-full px-4 h-12 flex items-center gap-3 bg-surface-container-lowest/40">
<span class="material-symbols-outlined text-on-surface-variant text-sm">search</span>
<input class="bg-transparent border-none outline-none text-sm font-body text-on-surface placeholder:text-on-surface-variant/50 w-full focus:ring-0" placeholder="Search members..." type="text"/>
</div>
<button class="glass-panel rounded-full px-4 h-12 flex items-center gap-2 bg-surface-container-highest/40 active:scale-95 transition-transform">
<span class="text-xs font-semibold text-primary">Role</span>
<span class="material-symbols-outlined text-xs text-primary">keyboard_arrow_down</span>
</button>
</div>
<!-- Team List -->
<div class="flex flex-col gap-4" data-slot-list="teamMembers">
<!-- TEMPLATE -->
<div class="glass-panel rounded-lg p-4 flex items-start gap-4 transition-all duration-300 hover:bg-surface-container-highest/60" data-slot-template>
<div class="relative">
<div class="w-14 h-14 rounded-full p-0.5 border border-primary/20">
<span class="w-full h-full rounded-full flex items-center justify-center font-headline font-bold text-sm text-primary bg-primary/10" data-slot-field="initials">--</span>
</div>
<div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-secondary border-2 border-surface rounded-full shadow-[0_0_8px_rgba(69,223,164,0.5)]"></div>
</div>
<div class="flex-1 min-w-0">
<h3 class="font-semibold text-on-surface truncate" data-slot-field="name">—</h3>
<p class="font-mono text-[10px] text-on-surface-variant/70 mb-2" data-slot-field="email">—</p>
<div class="flex flex-wrap gap-2">
<span class="px-2 py-0.5 bg-primary/10 text-primary border border-primary/20 text-[9px] font-bold rounded-full" data-slot-field="role">—</span>
<span class="px-2 py-0.5 bg-secondary/10 text-secondary text-[9px] font-bold rounded-full" data-slot-field="status">—</span>
</div>
</div>
<div class="flex flex-col gap-2">
<button class="w-8 h-8 rounded-full glass-panel flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-sm">edit</span>
</button>
<span class="font-mono text-[8px] text-on-surface-variant/40 text-center" data-slot-field="lastSeen">—</span>
</div>
</div>
<!-- EMPTY STATE -->
<div class="glass-panel rounded-2xl p-6 text-center" data-slot-empty>
<p class="font-headline font-semibold text-sm text-on-background mb-1">No team members yet</p>
<p class="font-mono text-[10px] text-on-surface-variant/60">Tap INVITE to add your first teammate.</p>
</div>
</div>
</main>
<!-- FAB -->
<button class="fixed bottom-28 right-6 z-50 bg-primary-container text-on-primary-container flex items-center gap-2 px-6 py-4 rounded-full shadow-[0_10px_30px_rgba(16,185,129,0.3)] font-bold tracking-tight active:scale-95 transition-all">
<span class="text-sm">INVITE +</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pt-3 pb-8 bg-[#14261f]/60 backdrop-blur-2xl border-t border-emerald-500/10 shadow-[0_-10px_40px_rgba(16,185,129,0.1)] rounded-t-[32px] z-50 max-w-md mx-auto right-0">
<div class="flex flex-col items-center justify-center text-emerald-900/50 hover:text-emerald-300 transition-all active:scale-90 animate-pulse-slow">
<span class="material-symbols-outlined">home</span>
<span class="font-['Inter'] font-semibold text-[10px] tracking-wider">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-emerald-900/50 hover:text-emerald-300 transition-all active:scale-90 animate-pulse-slow">
<span class="material-symbols-outlined">account_balance_wallet</span>
<span class="font-['Inter'] font-semibold text-[10px] tracking-wider">Wallets</span>
</div>
<div class="flex flex-col items-center justify-center text-emerald-900/50 hover:text-emerald-300 transition-all active:scale-90 animate-pulse-slow">
<span class="material-symbols-outlined">credit_card</span>
<span class="font-['Inter'] font-semibold text-[10px] tracking-wider">Cards</span>
</div>
<div class="flex flex-col items-center justify-center text-emerald-900/50 hover:text-emerald-300 transition-all active:scale-90 animate-pulse-slow">
<span class="material-symbols-outlined">insights</span>
<span class="font-['Inter'] font-semibold text-[10px] tracking-wider">Activity</span>
</div>
<div class="flex flex-col items-center justify-center text-emerald-400 bg-emerald-500/20 rounded-full px-5 py-1.5 shadow-[0_0_15px_rgba(16,185,129,0.3)] active:scale-90 animate-pulse-slow">
<span class="material-symbols-outlined">more_horiz</span>
<span class="font-['Inter'] font-semibold text-[10px] tracking-wider">More</span>
</div>
</nav>
<!-- Bottom Spacer for iOS (83pt total height) -->
<div class="h-24 w-full"></div>
</body></html>
