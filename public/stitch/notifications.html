<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Notifications Center | The Bioluminescent Archive</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-low": "#131e1a",
                    "on-tertiary-fixed": "#2a1700",
                    "surface-dim": "#0b1512",
                    "surface-container": "#17221e",
                    "secondary-fixed-dim": "#45dfa4",
                    "surface-container-high": "#222c29",
                    "on-error-container": "#ffdad6",
                    "surface-variant": "#2c3733",
                    "surface-container-highest": "#2c3733",
                    "on-primary": "#003824",
                    "tertiary-container": "#e29100",
                    "tertiary": "#ffb95f",
                    "secondary-container": "#00bd85",
                    "inverse-surface": "#d9e5df",
                    "on-tertiary": "#472a00",
                    "inverse-on-surface": "#28332f",
                    "background": "#0b1512",
                    "tertiary-fixed": "#ffddb8",
                    "on-tertiary-container": "#523200",
                    "on-tertiary-fixed-variant": "#653e00",
                    "on-background": "#d9e5df",
                    "secondary": "#45dfa4",
                    "on-secondary-fixed": "#002114",
                    "on-primary-container": "#00422b",
                    "on-surface": "#d9e5df",
                    "on-primary-fixed": "#002113",
                    "surface-tint": "#4edea3",
                    "inverse-primary": "#006c49",
                    "primary": "#4edea3",
                    "outline": "#86948a",
                    "on-surface-variant": "#bbcabf",
                    "tertiary-fixed-dim": "#ffb95f",
                    "primary-container": "#10b981",
                    "on-secondary-container": "#00452e",
                    "error": "#ffb4ab",
                    "secondary-fixed": "#68fcbf",
                    "primary-fixed-dim": "#4edea3",
                    "primary-fixed": "#6ffbbe",
                    "on-error": "#690005",
                    "error-container": "#93000a",
                    "on-primary-fixed-variant": "#005236",
                    "surface-container-lowest": "#06100d",
                    "outline-variant": "#3c4a42",
                    "on-secondary": "#003825",
                    "surface-bright": "#313b38",
                    "on-secondary-fixed-variant": "#005137",
                    "surface": "#0b1512"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"],
                    "mono": ["JetBrains Mono"]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #040d0a;
            color: #d9e5df;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .blob {
            position: absolute;
            width: 400px;
            height: 400px;
            background: #10b981;
            filter: blur(80px);
            opacity: 0.15;
            border-radius: 50%;
        }
        .diagonal-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: repeating-linear-gradient(45deg, rgba(16, 185, 129, 0.05) 0px, rgba(16, 185, 129, 0.05) 1px, transparent 1px, transparent 10px);
        }
        .glass-card {
            background: rgba(44, 55, 51, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(16, 185, 129, 0.08);
        }
        .bell-pulse {
            animation: bell-glow 2s infinite ease-in-out;
        }
        @keyframes bell-glow {
            0%, 100% { filter: drop-shadow(0 0 2px #10b981); opacity: 0.8; }
            50% { filter: drop-shadow(0 0 10px #10b981); opacity: 1; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen pb-32">
<!-- Ambient Background Elements -->
<div class="bg-blobs">
<div class="blob -top-20 -left-20"></div>
<div class="blob top-1/2 -right-20"></div>
<div class="blob -bottom-20 left-1/3"></div>
<div class="blob top-1/4 right-1/4" style="background: #34d399;"></div>
</div>
<div class="diagonal-lines"></div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#040d0a]/80 backdrop-blur-xl border-b border-emerald-500/10 shadow-[0_10px_40px_rgba(16,185,129,0.05)] flex items-center justify-between px-6 h-16 w-full">
<div class="flex items-center gap-4">
<button class="text-emerald-500 active:scale-95 transition-transform hover:bg-emerald-500/10 p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Inter'] font-extrabold uppercase tracking-wider text-transparent bg-clip-text bg-gradient-to-b from-[#10b981] to-[#34d399] text-xl">
                Notifications
            </h1>
</div>
<div class="flex items-center gap-6">
<div class="bell-pulse text-emerald-500">
<span class="material-symbols-outlined" data-icon="notifications" style="font-variation-settings: 'FILL' 1;">notifications</span>
</div>
<button class="font-['Inter'] font-bold text-xs tracking-widest text-emerald-500/80 hover:text-emerald-400 transition-colors uppercase">
                MARK READ
            </button>
</div>
</header>
<main class="pt-24 px-6 max-w-2xl mx-auto">
<!-- Sub-header -->
<div class="mb-8">
<p class="font-mono text-[10px] tracking-[0.2em] text-emerald-500/60 uppercase">
                ALL PULSES FROM YOUR ECOSYSTEM
            </p>
</div>
<!-- Filter Tabs -->
<div class="flex gap-2 p-1.5 glass-card rounded-full mb-8">
<button class="flex-1 py-2 px-4 rounded-full text-xs font-bold tracking-wider transition-all bg-primary-container text-on-primary-container">
                ALL
            </button>
<button class="flex-1 py-2 px-4 rounded-full text-xs font-bold tracking-wider transition-all text-emerald-500/60 hover:text-emerald-400 flex items-center justify-center gap-2">
                UNREAD
                <span class="bg-emerald-500 text-on-primary text-[10px] px-1.5 py-0.5 rounded-full">3</span>
</button>
<button class="flex-1 py-2 px-4 rounded-full text-xs font-bold tracking-wider transition-all text-emerald-500/60 hover:text-emerald-400">
                READ
            </button>
</div>
<!-- Notification List — fed from /api/notifications. The template below is
     cloned per item by StitchScreen's renderList(); data-slot-empty shows
     when the list is empty. -->
<div class="space-y-4" data-slot-list="notifications">
<!-- TEMPLATE — this node is kept hidden, cloned per API item -->
<div class="glass-card rounded-lg p-5 relative border-l-4" style="border-left-color: #34d399;" data-slot-template>
<div class="flex justify-between items-start">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-emerald-500/10 flex items-center justify-center text-emerald-400 shrink-0">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</div>
<div class="min-w-0">
<h3 class="font-semibold text-on-background" data-slot-field="title">Notification</h3>
<p class="text-sm text-on-surface-variant mt-0.5" data-slot-field="body"></p>
</div>
</div>
<div class="flex flex-col items-end gap-2 shrink-0">
<span class="font-mono text-[10px] text-emerald-500/40" data-slot-field="date"></span>
<span class="font-mono text-[10px] text-emerald-400" data-slot-field="unread"></span>
</div>
</div>
</div>
<!-- EMPTY STATE — shown when the list is empty -->
<div class="glass-card rounded-lg p-8 text-center" data-slot-empty>
<div class="w-12 h-12 rounded-full bg-emerald-500/10 flex items-center justify-center text-emerald-400 mx-auto mb-3">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</div>
<h3 class="font-semibold text-on-background mb-1">You're all caught up</h3>
<p class="text-sm text-on-surface-variant">Account activity and system messages will appear here.</p>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pt-3 pb-6 bg-[#040d0a]/40 backdrop-blur-2xl rounded-t-[32px] border-t border-emerald-500/10 shadow-[0_-10px_40px_rgba(16,185,129,0.08)]">
<div class="flex flex-col items-center justify-center text-emerald-900/40 hover:text-emerald-300 transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined text-2xl" data-icon="home">home</span>
<span class="font-['JetBrains_Mono'] text-[10px] tracking-widest font-bold mt-1">HOME</span>
</div>
<div class="flex flex-col items-center justify-center text-emerald-900/40 hover:text-emerald-300 transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined text-2xl" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-['JetBrains_Mono'] text-[10px] tracking-widest font-bold mt-1">WALLETS</span>
</div>
<div class="flex flex-col items-center justify-center text-emerald-900/40 hover:text-emerald-300 transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined text-2xl" data-icon="credit_card">credit_card</span>
<span class="font-['JetBrains_Mono'] text-[10px] tracking-widest font-bold mt-1">CARDS</span>
</div>
<div class="flex flex-col items-center justify-center text-emerald-900/40 hover:text-emerald-300 transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined text-2xl" data-icon="query_stats">query_stats</span>
<span class="font-['JetBrains_Mono'] text-[10px] tracking-widest font-bold mt-1">ACTIVITY</span>
</div>
<div class="flex flex-col items-center justify-center text-emerald-400 bg-emerald-500/10 rounded-full px-4 py-1 active:scale-90 duration-200">
<span class="material-symbols-outlined text-2xl" data-icon="more_horiz" style="font-variation-settings: 'FILL' 1;">more_horiz</span>
<span class="font-['JetBrains_Mono'] text-[10px] tracking-widest font-bold mt-1">MORE</span>
</div>
</nav>
</body></html>
