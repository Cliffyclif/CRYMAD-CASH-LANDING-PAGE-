            backdrop-filter: blur(20px);

<body class="bg-[#040d0a] text-on-background font-body min-h-screen selection:bg-primary/30">
<!-- Ambient Bioluminescent Background -->
<div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
<div class="absolute top-[-10%] left-[-10%] w-[60%] h-[60%] bg-primary/20 blur-[60px] rounded-full opacity-25"></div>
<div class="absolute bottom-[-5%] right-[-5%] w-[50%] h-[50%] bg-secondary/20 blur-[60px] rounded-full opacity-25"></div>
<div class="absolute top-[20%] right-[-10%] w-[40%] h-[40%] bg-primary/10 blur-[60px] rounded-full opacity-25"></div>
<div class="absolute bottom-[30%] left-[10%] w-[35%] h-[35%] bg-secondary/10 blur-[60px] rounded-full opacity-25"></div>
<div class="absolute inset-0 energy-lines"></div>
</div>
<!-- Status Bar Spacer (Mobile) -->
<div class="h-[44px] w-full fixed top-0 bg-[#040d0a]/40 backdrop-blur-xl z-[60]"></div>
<!-- TopAppBar -->
<header class="fixed top-[44px] left-0 w-full z-50 flex items-center justify-between px-4 h-[56px] bg-[#040d0a]/40 backdrop-blur-xl border-b border-emerald-500/10 shadow-[0_0_40px_rgba(16,185,129,0.05)]">
<button class="w-10 h-10 flex items-center justify-center text-emerald-500 hover:bg-emerald-500/5 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Inter'] font-extrabold text-2xl bg-gradient-to-b from-[#10b981] to-[#34d399] bg-clip-text text-transparent">Beneficiaries</h1>
<button class="w-10 h-10 flex items-center justify-center text-emerald-500 hover:bg-emerald-500/5 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</header>
<!-- Main Content -->
<main class="relative z-10 pt-[116px] pb-[120px] px-4 max-w-md mx-auto">
<!-- Subtitle & Search Section -->
<section class="mb-8 space-y-4">
<p class="font-mono text-[10px] tracking-[0.2em] text-secondary text-center uppercase opacity-80">MANAGE YOUR SAVED RECIPIENTS</p>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-emerald-500/50">
<span class="material-symbols-outlined" data-icon="search">search</span>
</div>
<input class="w-full h-14 pl-12 pr-4 glass-panel rounded-2xl font-mono text-sm tracking-tight border-emerald-500/10 focus:border-emerald-500/30 focus:ring-0 transition-all placeholder:text-on-surface-variant/40 text-on-surface" placeholder="SEARCH BY NAME OR BANK..." type="text"/>
</div>
<!-- Filter Chips -->
<div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
<button class="px-5 py-2 glass-panel rounded-full text-[10px] font-mono tracking-widest text-primary border-primary/30 whitespace-nowrap active:scale-95 transition-transform">ALL</button>
<button class="px-5 py-2 glass-panel rounded-full text-[10px] font-mono tracking-widest text-on-surface-variant/60 whitespace-nowrap active:scale-95 transition-transform">VERIFIED</button>
<button class="px-5 py-2 glass-panel rounded-full text-[10px] font-mono tracking-widest text-on-surface-variant/60 whitespace-nowrap active:scale-95 transition-transform">PENDING</button>
</div>
</section>
<!-- Beneficiary Cards List -->
<div class="space-y-3" data-slot-list="beneficiaries">
<!-- TEMPLATE — cloned per API item -->
<div class="glass-panel p-4 rounded-[20px] flex items-center gap-4 group active:scale-[0.98] transition-all" data-slot-template>
<div class="relative">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center text-primary font-extrabold border border-primary/20 shadow-[0_0_15px_rgba(16,185,129,0.1)]">
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>
</div>
<div class="flex-1 min-w-0">
<h3 class="font-semibold text-on-surface truncate" data-slot-field="fullName">Beneficiary</h3>
<div class="flex items-center gap-2 mt-1">
<span class="font-mono text-[11px] text-on-surface-variant/60 uppercase" data-slot-field="bankName"></span>
<span class="w-1 h-1 rounded-full bg-emerald-500/30"></span>
<span class="font-mono text-[11px] text-on-surface-variant/60 tracking-tighter" data-slot-field="accountNumberMasked"></span>
</div>
</div>
<div class="flex flex-col items-end gap-1">
<span class="px-2 py-0.5 rounded-full bg-secondary/10 text-[#4edea3] font-mono text-[9px] tracking-wider border border-secondary/20" data-slot-field="currency"></span>
<span class="material-symbols-outlined text-on-surface-variant/40" data-icon="chevron_right">chevron_right</span>
</div>
</div>
<!-- EMPTY STATE -->
<div class="glass-panel rounded-[20px] p-8 text-center" data-slot-empty>
<div class="w-12 h-12 rounded-full bg-emerald-500/10 flex items-center justify-center text-emerald-400 mx-auto mb-3">
<span class="material-symbols-outlined">group_add</span>
</div>
<h3 class="font-semibold text-on-background mb-1">No beneficiaries yet</h3>
<p class="text-sm text-on-surface-variant">Add a recipient to quickly send payments.</p>
</div>
</div>
</main>
<!-- FAB -->
<button class="fixed bottom-[110px] right-6 w-16 h-16 rounded-full bg-gradient-to-tr from-[#10b981] to-[#34d399] text-on-primary flex items-center justify-center shadow-[0_10px_40px_rgba(16,185,129,0.4)] z-[40] active:scale-90 transition-transform group">
<span class="material-symbols-outlined text-3xl" data-icon="add" style="font-variation-settings: 'FILL' 0, 'wght' 600;">add</span>
</button>

<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-6 pb-6 h-[83px] bg-[#040d0a]/60 backdrop-blur-2xl border-t border-emerald-500/10 rounded-t-[24px] shadow-[0_-10px_40px_rgba(16,185,129,0.08)]">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-[#d9e5df]/60 hover:text-emerald-300 transition-all active:scale-90 duration-300 ease-in-out" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-['JetBrains_Mono'] text-[10px] uppercase tracking-tighter">HOME</span>

<span class="material-symbols-outlined mb-1" data-icon="account_balance_wallet" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<span class="font-['JetBrains_Mono'] text-[10px] uppercase tracking-tighter">WALLETS</span>
</a>
<!-- Cards -->
<a class="flex flex-col items-center justify-center text-[#d9e5df]/60 hover:text-emerald-300 transition-all active:scale-90 duration-300 ease-in-out" href="#">
<span class="material-symbols-outlined mb-1" data-icon="credit_card">credit_card</span>
<span class="font-['JetBrains_Mono'] text-[10px] uppercase tracking-tighter">CARDS</span>
</a>
<!-- Activity -->
<a class="flex flex-col items-center justify-center text-[#d9e5df]/60 hover:text-emerald-300 transition-all active:scale-90 duration-300 ease-in-out" href="#">
<span class="material-symbols-outlined mb-1" data-icon="receipt_long">receipt_long</span>
<span class="font-['JetBrains_Mono'] text-[10px] uppercase tracking-tighter">ACTIVITY</span>
</a>
<!-- More -->
<a class="flex flex-col items-center justify-center text-[#d9e5df]/60 hover:text-emerald-300 transition-all active:scale-90 duration-300 ease-in-out" href="#">
<span class="material-symbols-outlined mb-1" data-icon="more_horiz">more_horiz</span>
<span class="font-['JetBrains_Mono'] text-[10px] uppercase tracking-tighter">MORE</span>
